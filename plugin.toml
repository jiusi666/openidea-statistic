id = "jiusi.statistic"
name = "Statistic 代码统计"
version = "0.2.0"
description = "不再只知道「有多少行」：按语言、目录、文件三种维度统计行数，并给出圈复杂度、嵌套深度、最长函数与 TODO 密度，合成 0–100 的风险分，直接告诉你哪个文件最该重构。高风险文件会在项目树上带感叹号徽标（悬停看详情），点一行就跳到最长函数的位置。只读项目文件，全部在本机计算，不联网、不执行任何程序，结果缓存在本机。欢迎一起参与开发，Java 技术交流 Q 群：700072697。"
authors = ["九思"]
license = "Apache-2.0"
change-notes = """0.2.0 — 从「数行数」变成「找该重构的文件」
· 新增按文件分组：每个文件给出总行、代码行、圈复杂度、最长函数（含起始行）、嵌套深度、TODO 数与 0–100 风险分
· 分语言 / 目录的汇总也带上圈复杂度与 TODO 数；卡片新增注释率、高风险文件数
· 项目树给高风险文件加感叹号徽标，悬停看「多少行 · CC 多少 · 最长函数在第几行」，点击面板里的文件行直接跳到最长函数
· 新增设置：超长文件、超长函数、高复杂度三个阈值，以及项目树标记开关
· 复杂度是按关键字计数的近似值（CC = 1 + 分支数），不做语法树分析；只对代码文件计算，文档与配置不参与风险排序
· 能力不变，仍是 project.read + storage 两个 Low；不联网、不执行程序、不写项目文件
0.1.1 — 介绍与项目推荐
· 插件介绍补上参与开发引导与 Java 技术交流 Q 群 700072697
· 市场条目新增项目文件建议（Suggested for This Project）
· 功能与能力不变
0.1.0 — 首个版本
· 按语言 / 一级目录两种分组，统计文件数、总行、代码行、注释行、空行与字节数
· 排除目录、单文件大小上限、隐藏文件、状态栏开关可配置
· 长任务带进度与取消，跳过二进制文件和超大文件，结果缓存在本机"""
categories = ["tools"]
engines.openidea = "^1.4"
icon = "icons/icon.svg"
icon-dark = "icons/icon_dark.svg"
wasm = "dist/plugin.wasm"
activation = ["on-view:statistic"]

# 能力即权限：project.read 只读项目文件，storage 只存本机缓存与面板偏好。
# 不申请 net: / process: / editor.write / vcs.*，插件不联网、不跑程序、不改文件。
[capabilities]
required = ["project.read", "storage"]

[[contributes.commands]]
id = "refresh"
title = "Statistic: 重新统计"
category = "Statistic"

[[contributes.commands]]
id = "switch-group"
title = "Statistic: 切换分组（语言 / 目录 / 文件）"
category = "Statistic"

[[contributes.commands]]
id = "clear-cache"
title = "Statistic: 清除缓存并重扫"
category = "Statistic"

[[contributes.keymaps]]
command = "refresh"
key = "Alt+Shift+S"
mac = "Meta+Shift+S"

[[contributes.views]]
id = "statistic"
title = "代码统计"
icon = "icons/view.svg"
location = "right"
web = "web/index.html"

[contributes.settings]
title = "Statistic 代码统计"
schema = "settings.schema.json"

[[contributes.statusBar]]
id = "jiusi.statistic.lines"
text = "—"
tooltip = "点击重新统计项目代码行数"
command = "refresh"
