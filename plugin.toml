id = "jiusi.statistic"
name = "Statistic 代码统计"
version = "0.1.0"
description = "按语言和目录统计当前项目的代码行数：总行、代码行、注释行、空行、文件数与字节数。只读项目文件，全部在本机计算，不联网、不执行任何程序，结果缓存在本机。"
authors = ["九思"]
license = "Apache-2.0"
change-notes = """0.1.0 — 首个版本
· 按语言 / 一级目录两种分组，统计文件数、总行、代码行、注释行、空行与字节数
· 排除目录、单文件大小上限、隐藏文件、状态栏开关可配置
· 长任务带进度与取消，跳过二进制文件和超大文件，结果缓存在本机"""
categories = ["tools"]
engines.openidea = "^1.4"
icon = "icons/icon.svg"
icon-dark = "icons/icon_dark.svg"
wasm = "dist/plugin.wasm"
activation = ["on-view:statistic"]

# 能力即权限：project.read 只读项目文件，storage 只存本机缓存与面板偏好。
# 不申请 net: / process: / editor.write / vcs.*，插件不联网、不跑程序、不改文件。
[capabilities]
required = ["project.read", "storage"]

[[contributes.commands]]
id = "refresh"
title = "Statistic: 重新统计"
category = "Statistic"

[[contributes.commands]]
id = "switch-group"
title = "Statistic: 切换分组（语言 / 目录）"
category = "Statistic"

[[contributes.commands]]
id = "clear-cache"
title = "Statistic: 清除缓存并重扫"
category = "Statistic"

[[contributes.keymaps]]
command = "refresh"
key = "Alt+Shift+S"
mac = "Meta+Shift+S"

[[contributes.views]]
id = "statistic"
title = "代码统计"
icon = "icons/view.svg"
location = "right"
web = "web/index.html"

[contributes.settings]
title = "Statistic 代码统计"
schema = "settings.schema.json"

[[contributes.statusBar]]
id = "jiusi.statistic.lines"
text = "—"
tooltip = "点击重新统计项目代码行数"
command = "refresh"
